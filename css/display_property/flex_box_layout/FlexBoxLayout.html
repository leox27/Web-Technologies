<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBoxproperty</title>
    <link rel="stylesheet" href="FlexBoxLayout.css">
</head>
<body>
    <!-- Course Headings -->
    <div id="courses_heading_container">
        <h1 id="core_python_heading" class="courses_headings">CorePython</h1>
        <h1 id="advance_python_heading" class="courses_headings">AdvancedPython</h1>
        <h1 id="web_development_heading" class="courses_headings">WebDevelopment</h1>
        <h1 id="mongo_db_heading" class="courses_headings">MongoDB</h1>
        <h1 id="d_jango_heading" class="courses_headings">DJango</h1>
    </div>

    <!-- Circular Balls -->
    <div id="circular_container">
        <div class="circular_blocks"></div>
        <div class="circular_blocks"></div>
    </div>

    <!-- Roman Numbers -->
    <div id="roman_numbers_blocks_container">
        <div id="first_roman_numbers" class="roman_numbers_blocks">I</div>
        <div id="second_roman_numbers" class="roman_numbers_blocks">II</div>
        <div id="third_roman_numbers" class="roman_numbers_blocks">III</div>
        <div id="fourth_roman_numbers" class="roman_numbers_blocks">IV</div>
        <div id="fifth_roman_numbers" class="roman_numbers_blocks">V</div>
    </div>

    <!-- Rectangular boxes -->
    <div id="rectangular_blocks_container">
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
    </div>

    <!-- Square boxes -->
    <div id="square_blocks_container">
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
    </div>


    <!-- Numbers -->
    <div id="numbers_blocks_container">
        <div class="numbers_blocks">One</div>
        <div class="numbers_blocks">Two</div>
        <div class="numbers_blocks">Three</div>
        <div class="numbers_blocks">Four</div>
        <div class="numbers_blocks">Five</div>
        <div class="numbers_blocks">Six</div>
        <div class="numbers_blocks">Seven</div>
        <div class="numbers_blocks">Eight</div>
        <div class="numbers_blocks">Nine</div>
        <div class="numbers_blocks">Ten</div>
        <div class="numbers_blocks">Eleven</div>
    </div>
</body>
</html>

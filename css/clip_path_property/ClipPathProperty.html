<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipPathProperty</title>
    <link rel="stylesheet" href="ClipPathProperty.css">
</head>
<body>
    <div id="clip_path_property_container">
        <div id="polygon_shapes_blocks_container" class="clip_path_property_tools">
            <h1 id="polygon_shapes">PolygonShapes</h1>
            <div id="first_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="second_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="third_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="fourth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="fifth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="sixth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="seventh_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="eighth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="ninth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="tenth_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="eleventh_polygon_block" class="polygon_shapes_blocks"></div>
            <div id="pentagon_shape_block"></div>
            <div id="octagon_shape_block"></div>
        </div>
        <div id="circle_shapes_container" class="clip_path_property_tools">
            <h1 id="circle_shapes">CircleShapes</h1>
            <div id="first_circle_shape_block"></div>
            <div id="second_circle_shape_block"></div>
            <div id="third_circle_shape_block"></div>
            <div id="fourth_circle_shape_block"></div>
            <div id="fifth_circle_shape_block"></div>
            <div id="dixth_circle_shape_block"></div>
            <div id="seventh_circle_shape_block"></div>
        </div>
        <div id="ellipse_shape_container" class="clip_path_property_tools">
            <h1 id="ellipse_shapes">EllipseShapes</h1>
            <div id="first_ellipse"></div>
            <div id="second_ellipse"></div>
            <div id="third_ellipse"></div>
            <div id="fourth_ellipse"></div>
            <div id="fifth_ellipse"></div>
        </div>
    </div>
</body>
</html>

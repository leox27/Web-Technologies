<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MountainTransitionedLoginPage</title>
    <link rel="stylesheet" href="MountainTransitionedLoginPage.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
    <div id="login_form_container">
        <h1 id="welcome_back_heading">Welcome Back User.</h1>
        <form action="" id="login_form">
            <input type="text" name="username" id="username_input_field" class="input_fields" placeholder="Username">
            <input type="text" name="password" id="password_input_field" class="input_fields" placeholder="Password">
            <input type="submit" value="LOGIN" id="login_button">
        </form>
        <fieldset id="or_fieldset">
            <legend id="or_fieldset_legend">OR</legend>
        </fieldset>
        <div id="sign_in_options_container">
            <span id="sign_in_options_heading">Sign in with : </span>
            <div id="social_media_icon_blocks_container">
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-facebook"></i>
                </span>
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-instagram"></i>
                </span>
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-google"></i>
                </span>
            </div>
        </div>
    </div>
    <div id="mountains_container"></div>
</body>
</html>

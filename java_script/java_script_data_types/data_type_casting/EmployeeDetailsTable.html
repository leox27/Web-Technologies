<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeDetailsTable</title>
    <link rel="stylesheet" href="EmployeeDetailsTable.css">
    <script src="EmployeeDetailsTable.js" defer></script>
</head>
<body>
    <table>
        <caption id="employee_table_caption">Employee&nbsp;Details</caption>
        <thead>
            <!-- 1st row -->
            <tr>
                <td class="employee_table_head_rows odd_rows">Employee Name</td>
                <td id="val_emp_name" class="employee_table_head_rows odd_rows"></td>
            </tr>
            <!-- 2nd row -->
            <tr>
                <td class="employee_table_head_rows even_rows">Employee Age</td>
                <td id="val_emp_age" class="employee_table_head_rows even_rows"></td>
            </tr>
            <!-- 3rd row -->
            <tr>
                <td class="employee_table_head_rows odd_rows">Employee Salary</td>
                <td id="val_emp_salary" class="employee_table_head_rows odd_rows"></td>
            </tr>
            <!-- 4th row -->
            <tr>
                <td class="employee_table_head_rows even_rows">Employee Designation</td>
                <td id="val_emp_designation" class="employee_table_head_rows even_rows"></td>
            </tr>
            <!-- 5th row -->
            <tr>
                <td class="employee_table_head_rows odd_rows">Employee Location</td>
                <td id="val_emp_location" class="employee_table_head_rows odd_rows"></td>
            </tr>
        </thead>
    </table>
</body>
</html>
